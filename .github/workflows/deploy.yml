name: Validate and deploy IONOSCOPE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and regression tests
        run: npm test
      - name: JavaScript syntax checks
        run: for file in js/*.js; do node --check "$file"; done
      - name: Install browser automation
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium firefox webkit
      - name: Serve the actual website via HTTP
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/ionoscope-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/ionoscope-http.log
          exit 1
      - name: Chromium full HTTP acceptance test
        run: python tests/http_e2e.py && python tests/release_browser.py && python tests/tutorial_browser.py
      - name: Firefox full HTTP acceptance test
        run: IONOSCOPE_BROWSER=firefox python tests/http_e2e.py && IONOSCOPE_BROWSER=firefox python tests/release_browser.py && IONOSCOPE_BROWSER=firefox python tests/tutorial_browser.py
      - name: WebKit full HTTP acceptance test
        run: IONOSCOPE_BROWSER=webkit python tests/http_e2e.py && IONOSCOPE_BROWSER=webkit python tests/release_browser.py && IONOSCOPE_BROWSER=webkit python tests/tutorial_browser.py
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results
      - name: Stage website files
        run: |
          mkdir -p _site
          cp index.html tutorial.html LICENSE _site/
          cp -r assets css js _site/
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload validated website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy validated static site
        id: deployment
        uses: actions/deploy-pages@v4
